<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>創作者代碼兌換追蹤・自訂分類版</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#eaf0ff;background:#0d1324}*{box-sizing:border-box}body{margin:0;padding:22px 14px 65px}.wrap{max-width:850px;margin:auto}h1{font-size:clamp(25px,5vw,36px);margin:8px 0}p{color:#aab9d4;margin:8px 0 20px}.top{background:linear-gradient(125deg,#233b73,#19223c);border:1px solid #3b5180;border-radius:22px;padding:22px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111b32;border-radius:14px;padding:13px;text-align:center}.num{font-size:28px;font-weight:800}.lab{font-size:12px;color:#adbedb}.bar{height:10px;background:#101a30;border-radius:20px;overflow:hidden;margin-top:17px}.fill{height:100%;width:0;background:#6ee7b7;transition:width .2s}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 20px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#33476f;color:white;font-weight:650}button:hover{filter:brightness(1.17)}button:focus-visible,input:focus-visible{outline:2px solid #83b5ff;outline-offset:2px}.filter.active{background:#497be6}.section{margin-top:27px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.heading h2{font-size:20px;margin:0}.count{color:#aab9d4;font-size:13px}.entries{display:grid;gap:9px}.entry{background:#18243b;border:1px solid #2d3d5a;border-radius:15px;padding:13px;display:grid;grid-template-columns:34px minmax(85px,1fr) minmax(110px,1.4fr) auto;gap:9px;align-items:center}.entry.done{border-color:#2d7c65;background:#142c2e}.check{width:23px;height:23px;accent-color:#54d7a2;cursor:pointer}.name{font-weight:750}.code{width:100%;min-width:0;background:#0d182d;color:#f3f7ff;border:1px solid #3c506e;border-radius:9px;padding:10px}.code::placeholder{color:#7184a3}.copy{background:#29476b;white-space:nowrap}.copy:disabled{opacity:.35;cursor:not-allowed}.status{font-size:11px;color:#6ee7b7;display:block;margin-top:3px}.hint{font-size:12px;color:#9aaecb;margin-top:22px;line-height:1.6}.empty{padding:22px;text-align:center;color:#9bb0d0;background:#172238;border-radius:12px}@media(max-width:520px){.entry{grid-template-columns:28px minmax(0,1fr) auto;gap:8px}.name{grid-column:2;grid-row:1}.entry .check{grid-column:1;grid-row:1}.code{grid-column:2;grid-row:2}.copy{grid-column:3;grid-row:2}.status{font-size:10px}.top{padding:17px}.num{font-size:23px}}
.panel{background:#18243b;border:1px solid #344666;border-radius:16px;padding:16px;margin:16px 0}.panel h2{font-size:18px;margin:0 0 12px}.fields{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.fields input,.fields select{background:#0d182d;color:#fff;border:1px solid #3c506e;border-radius:9px;padding:11px;min-width:0;flex:1 1 140px;font:inherit}.fields button{flex:0 0 auto}.danger{background:#703846}.small{font-size:12px;padding:7px 9px}.muted{color:#aab9d4;font-size:13px}.entry{grid-template-columns:30px minmax(95px,1fr) minmax(100px,1.3fr) auto auto}.heading-actions{display:flex;gap:6px;flex-wrap:wrap}.entry-actions{display:flex;gap:5px}.entry-actions button{padding:8px}.notice{color:#b8c9e8;font-size:12px;margin-top:10px}@media(max-width:650px){.entry{grid-template-columns:28px minmax(0,1fr) auto;gap:8px}.entry .check{grid-column:1;grid-row:1}.name{grid-column:2;grid-row:1}.entry-actions{grid-column:3;grid-row:1}.code{grid-column:2;grid-row:2}.copy{grid-column:3;grid-row:2}.heading{align-items:flex-start}.heading-actions{justify-content:flex-end}}
</style></head><body><main class="wrap"><div class="top"><div style="font-size:13px;color:#b7ccf7">自訂分類・兌換進度管理</div><h1>🎁 創作者代碼兌換</h1><p>新增創作者、自訂分類、填入序號、勾選已兌換。</p><div class="stats"><div class="stat"><div class="num" id="completed">0</div><div class="lab">已兌換</div></div><div class="stat"><div class="num" id="available">0</div><div class="lab">待兌換（已公布）</div></div><div class="stat"><div class="num" id="unreleased">0</div><div class="lab">尚未公布</div></div></div><div class="bar"><div class="fill" id="progress"></div></div><div id="percent" style="text-align:right;color:#c5d4ef;font-size:12px;margin-top:7px">0% 完成</div></div>
<div class="panel"><h2>➕ 新增創作者</h2><form class="fields" id="addCreator"><input id="newName" placeholder="創作者名稱" required maxlength="80"><input id="newCode" placeholder="兌換碼（可留空）" maxlength="200"><select id="newGroup" aria-label="選擇分類"></select><button type="submit">新增創作者</button></form></div>
<div class="panel"><h2>📁 自訂分類</h2><form class="fields" id="addGroup"><input id="newGroupName" placeholder="新分類名稱，例如：第二波活動" required maxlength="60"><button type="submit">新增分類</button></form><div class="notice">分類可在下方重新命名或刪除；刪除非空分類時可選擇將創作者移到其他分類。</div></div>
<div class="tools"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="pending">待兌換</button><button class="filter" data-filter="unreleased">尚未公布</button><button class="filter" data-filter="done">已兌換</button><button id="export">匯出備份</button><button id="import">匯入備份</button><input type="file" id="file" accept="application/json,.json" hidden></div><div id="sections"></div><p class="hint">紀錄儲存在目前瀏覽器內，不會自動跨裝置同步。建議定期匯出備份；若從舊版升級，請盡量在同一瀏覽器與相同網址開啟。</p></main><script>
const seed=[{name:'一般創作者',items:[['Rui',''],['里歐',''],['皮皮','17baby'],['小亮','XLIANG'],['獅子丸','SHISHI'],['小夜夜',''],['艾希',''],['瓜肉','GUAROU'],['小君',''],['初吻',''],['基德薯叔','unkidd'],['肯倫','kinlun'],['八毛','bamao8'],['光光實驗室',''],['小六','mabus6']]},{name:'隱藏關',items:[['阿嚕嚕','ARURU8'],['菇喜','GOODC8'],['魚丸','Yuwan8'],['小貓奈奈','NEKONA'],['二犬','Twodog']]}];
const KEY='creator-code-tracker-v2',OLD='creator-code-tracker-v1';
const uid=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function fresh(){let old={};try{old=JSON.parse(localStorage.getItem(OLD)||'{}')}catch{};const groups=[],items=[];for(const g of seed){const id=uid();groups.push({id,name:g.name});for(const [name,code] of g.items){const v=old[name];items.push({id:uid(),groupId:id,name,code:typeof v?.code==='string'?v.code:code,done:typeof v?.done==='boolean'?v.done:false})}}return {version:2,groups,items}}
function valid(x){return x&&Array.isArray(x.groups)&&Array.isArray(x.items)&&x.groups.every(g=>typeof g.id==='string'&&typeof g.name==='string')&&x.items.every(i=>typeof i.id==='string'&&typeof i.groupId==='string'&&typeof i.name==='string'&&typeof i.code==='string'&&typeof i.done==='boolean')&&new Set(x.groups.map(g=>g.id)).size===x.groups.length&&new Set(x.items.map(i=>i.id)).size===x.items.length&&x.items.every(i=>x.groups.some(g=>g.id===i.groupId))}
let state;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');state=valid(saved)?saved:fresh()}catch{state=fresh()}let filter='all';
const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('無法儲存，請確認瀏覽器允許本機儲存')}};
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function button(label,fn,cls='small'){const b=el('button',cls,label);b.type='button';b.onclick=fn;return b}
function matching(i){return filter==='all'||(filter==='done'&&i.done)||(filter==='pending'&&i.code.trim()&&!i.done)||(filter==='unreleased'&&!i.code.trim())}
function stats(){const done=state.items.filter(i=>i.done).length;$('completed').textContent=done;$('available').textContent=state.items.filter(i=>i.code.trim()&&!i.done).length;$('unreleased').textContent=state.items.filter(i=>!i.code.trim()).length;const pct=state.items.length?Math.round(done/state.items.length*100):0;$('progress').style.width=pct+'%';$('percent').textContent=pct+'% 完成（'+done+'/'+state.items.length+'）'}
function render(){const select=$('newGroup'),chosen=select.value;select.replaceChildren();for(const g of state.groups){const o=el('option','',g.name);o.value=g.id;select.append(o)}if(state.groups.some(g=>g.id===chosen))select.value=chosen;const root=$('sections');root.replaceChildren();for(const g of state.groups){const items=state.items.filter(i=>i.groupId===g.id),section=el('section','section'),heading=el('div','heading'),left=el('div'),h=el('h2','',(g.name==='隱藏關'?'🔐 ':'📁 ')+g.name),count=el('span','count',items.filter(i=>i.done).length+' / '+items.length+' 已兌換'),actions=el('div','heading-actions');left.append(h,count);actions.append(button('重新命名',()=>{const name=prompt('分類的新名稱：',g.name);if(name===null)return;const v=name.trim();if(!v)return alert('名稱不可為空');if(state.groups.some(x=>x.id!==g.id&&x.name===v))return alert('分類名稱已存在');g.name=v;save();render()}),button('刪除分類',()=>removeGroup(g.id),'small danger'));heading.append(left,actions);section.append(heading);const entries=el('div','entries');let shown=0;for(const i of items){if(!matching(i))continue;shown++;const row=el('div','entry'+(i.done?' done':'')),cb=el('input','check');cb.type='checkbox';cb.checked=i.done;cb.setAttribute('aria-label',i.name+' 已兌換');cb.onchange=()=>{i.done=cb.checked;save();render()};const nm=el('div','name',i.name);if(i.done)nm.append(el('span','status','✓ 已兌換'));const inp=el('input','code');inp.value=i.code;inp.placeholder='尚未公布';inp.setAttribute('aria-label',i.name+' 的兌換序號');inp.oninput=()=>{i.code=inp.value;save();stats();copy.disabled=!i.code.trim()};inp.onchange=()=>render();const copy=button('複製',async()=>{try{await navigator.clipboard.writeText(i.code);copy.textContent='已複製 ✓';setTimeout(()=>copy.textContent='複製',1200)}catch{inp.focus();inp.select();alert('請手動複製選取的序號')}} ,'copy');copy.disabled=!i.code.trim();const ops=el('div','entry-actions');ops.append(button('編輯',()=>editCreator(i.id)),button('刪除',()=>{if(confirm('確定刪除「'+i.name+'」？')){state.items=state.items.filter(x=>x.id!==i.id);save();render()}},'small danger'));row.append(cb,nm,inp,copy,ops);entries.append(row)}if(!shown)entries.append(el('div','empty','此分類目前沒有符合條件的項目'));section.append(entries);root.append(section)}stats()}
function editCreator(id){const i=state.items.find(x=>x.id===id);if(!i)return;const name=prompt('修改創作者名稱：',i.name);if(name===null)return;if(!name.trim())return alert('名稱不可為空');const code=prompt('修改兌換碼（可留空）：',i.code);if(code===null)return;const options=state.groups.map((g,n)=>(n+1)+'：'+g.name).join('\n');const selected=prompt('選擇分類編號：\n'+options,String(state.groups.findIndex(g=>g.id===i.groupId)+1));if(selected===null)return;const n=Number(selected);if(!Number.isInteger(n)||n<1||n>state.groups.length)return alert('分類編號無效');i.name=name.trim();i.code=code.trim();i.groupId=state.groups[n-1].id;save();render()}
function removeGroup(id){const g=state.groups.find(x=>x.id===id);if(!g)return;if(state.groups.length===1)return alert('至少需要保留一個分類');const affected=state.items.filter(i=>i.groupId===id);if(affected.length){const others=state.groups.filter(x=>x.id!==id);const choice=prompt('此分類有 '+affected.length+' 位創作者。請輸入要移入的分類編號（取消則不刪除）：\n'+others.map((x,n)=>(n+1)+'：'+x.name).join('\n'),'1');if(choice===null)return;const n=Number(choice);if(!Number.isInteger(n)||n<1||n>others.length)return alert('分類編號無效');for(const i of affected)i.groupId=others[n-1].id}else if(!confirm('確定刪除空分類「'+g.name+'」？'))return;state.groups=state.groups.filter(x=>x.id!==id);save();render()}
$('addGroup').onsubmit=e=>{e.preventDefault();const name=$('newGroupName').value.trim();if(!name)return;if(state.groups.some(g=>g.name===name))return alert('分類已存在');state.groups.push({id:uid(),name});$('newGroupName').value='';save();render()};
$('addCreator').onsubmit=e=>{e.preventDefault();const name=$('newName').value.trim(),code=$('newCode').value.trim(),groupId=$('newGroup').value;if(!name||!state.groups.some(g=>g.id===groupId))return;state.items.push({id:uid(),groupId,name,code,done:false});$('newName').value='';$('newCode').value='';save();render()};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='創作者兌換紀錄_含分類.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(valid(x)){if(confirm('匯入將覆蓋目前所有分類和兌換紀錄，確定嗎？')){state=x;save();render();alert('匯入完成')}}else if(x&&x.data&&typeof x.data==='object'){if(confirm('偵測到舊版備份，將以其序號及勾選紀錄更新同名的預設創作者。確定嗎？')){const s=fresh();for(const i of s.items){const v=x.data[i.name];if(v&&typeof v.code==='string'&&typeof v.done==='boolean'){i.code=v.code;i.done=v.done}}state=s;save();render();alert('舊版備份匯入完成')}}else throw Error('format')}catch{alert('備份格式不正確')}e.target.value=''};
render();
</script></body></html>
