<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>創作者代碼兌換追蹤</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#e9eefb;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:24px 16px 80px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}h2{font-size:20px}.muted{color:#9daac2}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.panel{background:#151f31;border:1px solid #2b3b55;border-radius:16px;padding:18px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#1d2b43;border-radius:12px;padding:14px}.stat b{font-size:26px;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border-radius:9px;padding:10px 12px}button{border:1px solid #536b91;background:#273b5c;color:#fff;cursor:pointer}button:hover{background:#36517d}button.primary{background:#366cf0;border-color:#366cf0}button.danger{background:#602d3a;border-color:#914457}input,select{background:#10192a;color:#fff;border:1px solid #465a79;min-width:0}input[type=checkbox]{width:22px;height:22px;accent-color:#55cc9c;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}.item{background:#1a2940;border:1px solid #344760;border-radius:12px;padding:14px}.item.done{opacity:.68;border-color:#368a73}.item .head{display:flex;justify-content:space-between;gap:8px;align-items:center}.item strong{font-size:18px}.code{font-family:ui-monospace,monospace;letter-spacing:.5px;overflow-wrap:anywhere;font-size:15px;margin:10px 0}.tag{font-size:12px;color:#a8b9d4}.item-actions{display:flex;gap:6px;flex-wrap:wrap}.item-actions button{padding:6px 9px;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0}.hidden{display:none!important}.status{padding:10px;border-radius:9px;background:#26364e;margin-top:12px}.ok{color:#78e3b3}.warn{color:#ffd18b}label{display:block;font-size:13px;color:#b4c3da;margin-bottom:5px}.field{margin-bottom:10px}.field input,.field select{width:100%}small{color:#9daac2}a{color:#91b9ff}@media(max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:22px}}</style></head><body><main>
<div class="top"><div><h1>🎟️ 創作者代碼兌換</h1><div class="muted">雲端同步創作者名單・每個人獨立保存兌換紀錄</div></div><button id="loginBtn">管理員登入</button></div>
<div class="panel"><div class="toolbar"><label for="waveSelect" style="margin:0">活動波次</label><select id="waveSelect" aria-label="選擇活動波次"><option value="wave_1">第 1 波（歷史紀錄）</option></select><span id="waveStatus" class="muted"></span></div></div>
<div id="connection" class="status">正在連接 Firebase…</div>
<div class="panel"><div class="stats"><div class="stat"><small>總創作者</small><b id="total">0</b></div><div class="stat"><small>已兌換</small><b id="done">0</b></div><div class="stat"><small>待兌換</small><b id="left">0</b></div></div><div class="toolbar" style="margin-top:16px"><input id="search" placeholder="搜尋創作者或序號" aria-label="搜尋創作者或序號"><select id="filter"><option value="all">全部狀態</option><option value="todo">尚未兌換</option><option value="done">已兌換</option><option value="unreleased">尚未公布</option></select><button id="exportBtn">匯出我的勾選</button><button id="importBtn">匯入我的勾選</button><input type="file" id="importFile" accept="application/json" class="hidden"></div></div>
<div id="adminPanel" class="panel hidden"><h2>🛠️ 管理員控制台</h2><p class="muted">只有符合 Firestore 安全規則的管理員才能修改雲端資料。</p><div class="toolbar"><button class="primary" id="seedBtn">建立本波預設 35 位創作者</button><button id="logoutBtn">登出</button></div><h3>活動波次管理</h3><p class="muted">新增波次不會刪除第一波資料或任何人的舊勾選。請先匯出勾選備份。</p><div class="toolbar"><input id="newWave" placeholder="例如：第 2 波、聖誕活動"><button id="addWave" class="primary">新增活動波次</button></div><div id="waveManager" style="margin-top:10px"></div><h3>分類管理（目前波次）</h3><div class="toolbar"><input id="newCategory" placeholder="新分類名稱"><button id="addCategory">新增分類</button></div><div id="categoryManager" style="margin-top:10px"></div><h3>創作者管理</h3><div class="admin-grid"><div><label>名稱</label><input id="creatorName" placeholder="創作者名稱"></div><div><label>序號（可空白）</label><input id="creatorCode" placeholder="尚未公布可留空"></div><div><label>分類</label><select id="creatorCategory"></select></div></div><div class="toolbar"><button class="primary" id="saveCreator">新增創作者</button><button id="cancelEdit" class="hidden">取消編輯</button></div></div>
<div id="sections"></div><p class="muted" style="margin-top:30px;font-size:13px">提醒：兌換勾選只儲存在目前裝置／瀏覽器。更換裝置或清除瀏覽器資料前，請先匯出備份。</p>
</main><script type="module">
// 在 Firebase Console → 專案設定 → 你的應用程式 → SDK 設定，複製這六個欄位。
const firebaseConfig = {
  databaseURL: "https://artale-8d93e-default-rtdb.asia-southeast1.firebasedatabase.app",
  apiKey: "AIzaSyBQRtguwGMfnQ6G-S5OAQJ80XRn5aPQmdE",
  authDomain: "artale-8d93e.firebaseapp.com",
  projectId: "artale-8d93e",
  storageBucket: "artale-8d93e.firebasestorage.app",
  messagingSenderId: "982580860570",
  appId: "1:982580860570:web:78a9c28c676065bd123123"
};
const ADMIN_UID = "eJjvCIpPQpX7ZPetg31Um9E2lz93"; // Firebase Authentication → Users → UID
const firebaseReady = firebaseConfig.apiKey !== 'REPLACE_ME' && firebaseConfig.projectId !== 'REPLACE_ME' && ADMIN_UID !== 'REPLACE_WITH_ADMIN_UID';
const $=id=>document.getElementById(id);const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const defaults=[["Rui",""],["里歐",""],["皮皮",""],["小亮",""],["獅子丸",""],["小夜夜",""],["艾希",""],["瓜肉",""],["小君",""],["初吻",""],["基德薯叔",""],["肯倫",""],["八毛",""],["光光實驗室",""],["小六",""],["阿嚕嚕",""],["菇喜",""],["魚丸",""],["小貓奈奈",""],["二犬",""],["金金",""],["鈴姆",""],["傑克雪諾",""],["卡祖笛",""],["咪咪蛋",""],["taxicute",""],["可比_",""],["路過大學生",""],["馬克巴巴",""],["薯餅姐姐",""],["阿偉-Wei",""],["短腿娜娜",""],["ivanl艾文",""],["愛文",""],["兔森森",""]];
const seedCats=[{id:'general',name:'一般創作者',order:0},{id:'hidden',name:'隱藏關',order:1}];
let categories=[],creators=[],auth=null,db=null,user=null,editId=null;let pendingWave=null;let waves=[{id:'wave_1',name:'第 1 波（歷史紀錄）',order:1}],currentWave='wave_1',unsubscribeCats=null,unsubscribeCreators=null;const checkedKey='creator-sync-checked-v1';let checked={};try{checked=JSON.parse(localStorage.getItem(checkedKey)||'{}')||{}}catch{checked={}};const waveChecked=()=>currentWave==='wave_1'?checked:(checked[currentWave]||{});const activeCollection=col=>currentWave==='wave_1'?col:`events/${currentWave}/${col}`;
const saveChecked=()=>localStorage.setItem(checkedKey,JSON.stringify(checked));const isChecked=id=>!!waveChecked()[id];const setChecked=(id,value)=>{if(currentWave==='wave_1')checked[id]=value;else{checked[currentWave]??={};checked[currentWave][id]=value}saveChecked()};
const setStatus=(s,good=false)=>{$('connection').textContent=s;$('connection').className='status '+(good?'ok':'warn')};
const admin=()=>!!user&&user.uid===ADMIN_UID;
function render(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value;const ids=new Set(creators.map(x=>x.id));const count=creators.filter(x=>isChecked(x.id)).length;$('total').textContent=creators.length;$('done').textContent=count;$('left').textContent=creators.length-count;$('sections').replaceChildren();const cats=[...categories].sort((a,b)=>(a.order||0)-(b.order||0));for(const cat of cats){const all=creators.filter(c=>c.categoryId===cat.id);const items=all.filter(c=>(c.name+' '+(c.code||'')).toLowerCase().includes(q)).filter(c=>f==='all'||(f==='todo'&&!isChecked(c.id)&&!!c.code)||(f==='done'&&isChecked(c.id))||(f==='unreleased'&&!c.code));if(!items.length&&q)continue;if(!items.length&&f!=='all')continue;const section=el('section','panel');const header=el('div','section-title');header.append(el('h2','',cat.name),el('span','muted',`${all.filter(x=>isChecked(x.id)).length} / ${all.length} 已兌換`));section.append(header);const grid=el('div','cards');for(const c of items){const card=el('div','item'+(isChecked(c.id)?' done':''));const head=el('div','head');head.append(el('strong','',c.name));const check=document.createElement('input');check.type='checkbox';check.checked=!!isChecked(c.id);check.disabled=!c.code;check.title=c.code?'標記已兌換':'序號尚未公布';check.addEventListener('change',()=>{setChecked(c.id,check.checked);render()});head.append(check);card.append(head,el('div','code',c.code||'⏳ 尚未公布'));const actions=el('div','item-actions');if(c.code){const copy=el('button','','複製序號');copy.onclick=async()=>{try{await navigator.clipboard.writeText(c.code);copy.textContent='已複製 ✓'}catch{prompt('請手動複製序號',c.code)}};actions.append(copy)}if(admin()){const edit=el('button','','編輯');edit.onclick=()=>{editId=c.id;$('creatorName').value=c.name;$('creatorCode').value=c.code||'';$('creatorCategory').value=c.categoryId;$('saveCreator').textContent='儲存修改';$('cancelEdit').classList.remove('hidden');$('adminPanel').scrollIntoView({behavior:'smooth'})};const del=el('button','danger','刪除');del.onclick=async()=>{if(confirm(`確定刪除 ${c.name}？`))await writeDelete(activeCollection('creators'),c.id)};actions.append(edit,del)}card.append(actions);grid.append(card)}section.append(grid);$('sections').append(section)}if(!cats.length)$('sections').append(el('p','muted','尚無分類。請由管理員登入並建立預設資料。'));renderAdmin()}
function renderAdmin(){const managerW=$('waveManager');managerW.replaceChildren();for(const w of waves){const line=el('div','toolbar');line.style.margin='6px 0';line.append(el('span','',w.name));if(w.id!=='wave_1'){const rename=el('button','','重新命名');rename.onclick=async()=>{const name=prompt('新的活動名稱',w.name)?.trim();if(name)await writeSet('events',w.id,{...w,name})};line.append(rename)}managerW.append(line)}$('adminPanel').classList.toggle('hidden',!admin());$('loginBtn').textContent=user?'登出管理員':'管理員登入';const select=$('creatorCategory');const old=select.value;select.replaceChildren();const manager=$('categoryManager');manager.replaceChildren();for(const cat of categories){const opt=new Option(cat.name,cat.id);select.add(opt);const r=el('div','toolbar');r.style.margin='6px 0';r.append(el('span','',cat.name));const rename=el('button','','重新命名');rename.onclick=async()=>{const name=prompt('新的分類名稱',cat.name)?.trim();if(name&&name!==cat.name)await writeSet(activeCollection('categories'),cat.id,{...cat,name})};const del=el('button','danger','刪除分類');del.onclick=async()=>{if(creators.some(c=>c.categoryId===cat.id))return alert('請先移動或刪除這個分類中的創作者。');if(confirm(`確定刪除分類 ${cat.name}？`))await writeDelete(activeCollection('categories'),cat.id)};r.append(rename,del);manager.append(r)}if([...select.options].some(o=>o.value===old))select.value=old}
let fs=null;async function writeSet(col,id,data){try{await fs.setDoc(fs.doc(db,...(col.includes('/')?col.split('/'): [col]),id),data);setStatus('雲端資料更新成功',true)}catch(e){alert('更新失敗：'+e.message)}}async function writeDelete(col,id){try{await fs.deleteDoc(fs.doc(db,...(col.includes('/')?col.split('/'): [col]),id));setStatus('雲端資料刪除成功',true)}catch(e){alert('刪除失敗：'+e.message)}}
$('waveSelect').onchange=()=>switchWave($('waveSelect').value);$('addWave').onclick=async()=>{const name=$('newWave').value.trim();if(!name)return alert('請輸入活動名稱');if(waves.some(w=>w.name===name))return alert('活動名稱已存在');const id='wave_'+crypto.randomUUID().replaceAll('-','');await writeSet('events',id,{name,order:Date.now()});$('newWave').value='';pendingWave=id};function renderWaves(){const select=$('waveSelect');select.replaceChildren();for(const w of waves)select.add(new Option(w.name,w.id));select.value=currentWave;$('waveStatus').textContent='各波次獨立保存勾選';renderAdmin()}function switchWave(id){if(!waves.some(w=>w.id===id))return;currentWave=id;editId=null;$('cancelEdit').click();categories=[];creators=[];renderWaves();render();if(unsubscribeCats)unsubscribeCats();if(unsubscribeCreators)unsubscribeCreators();if(!db||!fs)return;unsubscribeCats=fs.onSnapshot(fs.collection(db,...activeCollection('categories').split('/')),snap=>{categories=snap.docs.map(d=>({id:d.id,...d.data()}));render();setStatus('已連線：'+waves.find(w=>w.id===currentWave)?.name,true)},e=>setStatus('分類讀取失敗：'+e.message));unsubscribeCreators=fs.onSnapshot(fs.collection(db,...activeCollection('creators').split('/')),snap=>{creators=snap.docs.map(d=>({id:d.id,...d.data()}));render();setStatus('已連線：'+waves.find(w=>w.id===currentWave)?.name,true)},e=>setStatus('創作者讀取失敗：'+e.message))};$('search').oninput=render;$('filter').onchange=render;
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,checked},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的兌換紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.checked||typeof data.checked!=='object'||Array.isArray(data.checked))throw Error('備份格式不符');checked=Object.fromEntries(Object.entries(data.checked).filter(([k,v])=>typeof k==='string'&&(typeof v==='boolean'||(v&&typeof v==='object'&&!Array.isArray(v)))));saveChecked();render();alert('匯入成功')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
$('cancelEdit').onclick=()=>{editId=null;$('creatorName').value='';$('creatorCode').value='';$('saveCreator').textContent='新增創作者';$('cancelEdit').classList.add('hidden')};
$('addCategory').onclick=async()=>{const name=$('newCategory').value.trim();if(!name)return alert('請輸入分類名稱');if(categories.some(c=>c.name===name))return alert('分類已存在');await writeSet(activeCollection('categories'),crypto.randomUUID(),{name,order:categories.length});$('newCategory').value=''};
$('saveCreator').onclick=async()=>{const name=$('creatorName').value.trim(),code=$('creatorCode').value.trim(),categoryId=$('creatorCategory').value;if(!name||!categoryId)return alert('請輸入名稱並選擇分類');await writeSet(activeCollection('creators'),editId||crypto.randomUUID(),{name,code,categoryId});$('cancelEdit').click()};
$('seedBtn').textContent='建立本波預設 35 位創作者';$('seedBtn').onclick=async()=>{if(categories.length||creators.length)return alert('目前波次已有內容，無法重複初始化。');if(!confirm('確定在目前波次建立 2 個分類及 35 位預設創作者？'))return;try{const batch=fs.writeBatch(db);for(const c of seedCats)batch.set(fs.doc(db,...activeCollection('categories').split('/'),c.id),c);defaults.forEach(([name,code],i)=>batch.set(fs.doc(db,...activeCollection('creators').split('/'),'seed-'+String(i+1).padStart(2,'0')),{name,code,categoryId:'general'}));await batch.commit();setStatus('已建立預設名單',true)}catch(e){alert('初始化失敗：'+e.message)}};
$('loginBtn').onclick=async()=>{if(!firebaseReady)return alert('請先完成 Firebase 設定');if(user){try{await auth.signOut(auth.instance);setStatus('已登出管理員，現在是訪客模式',true)}catch(e){alert('登出失敗：'+e.message)}return;}const email=prompt('管理員 Email');if(!email)return;const password=prompt('管理員密碼（請勿在他人裝置登入）');if(!password)return;try{await auth.signInWithEmailAndPassword(auth.instance,email,password)}catch(e){alert('登入失敗：'+e.message)}};
$('logoutBtn').onclick=async()=>{try{await auth.signOut(auth.instance);setStatus('已登出管理員，現在是訪客模式',true)}catch(e){alert('登出失敗：'+e.message)}};
render();
if(firebaseReady){try{const [appMod,authMod,fireMod]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);const app=appMod.initializeApp(firebaseConfig);db=fireMod.getFirestore(app);fs=fireMod;auth={...authMod,instance:authMod.getAuth(app)};authMod.onAuthStateChanged(auth.instance,u=>{user=u;render();if(u&&!admin())setStatus('已登入，但此帳號沒有管理員權限。',false)});fireMod.onSnapshot(fireMod.collection(db,'events'),snap=>{waves=[{id:'wave_1',name:'第 1 波（歷史紀錄）',order:1},...snap.docs.map(d=>({id:d.id,...d.data()})).filter(w=>w.id!=='wave_1').sort((a,b)=>(a.order||0)-(b.order||0))];if(!waves.some(w=>w.id===currentWave))currentWave='wave_1';renderWaves();if(pendingWave&&waves.some(w=>w.id===pendingWave)){const next=pendingWave;pendingWave=null;switchWave(next)}},e=>setStatus('活動列表讀取失敗：'+e.message));switchWave(currentWave)}catch(e){setStatus('Firebase 載入失敗：'+e.message)}}
</script></body></html>
